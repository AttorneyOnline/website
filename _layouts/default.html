<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>
        {% if page.title %}
            {{ page.title }} - Attorney Online
        {% else %}
            Attorney Online
        {% endif %}
    </title>

    <meta name="description" content="Attorney Online - a roleplaying chatroom based primarily in the Ace Attorney universe.">
    <meta name="author" content="Attorney Online">
    <meta name="keywords" content="ace attorney, attorney online, phoenix wright, roleplay">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Oswald%7CRoboto+Condensed%7CPoiret+One&display=swap"
          rel="stylesheet">

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/css/styles.css?ref=2' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">

    <link rel="shortcut icon"
          href="{{ '/img/favicon.ico' | relative_url }}"
          type="image/x-icon">
</head>


<body class="text-white">

{% include navbar.html %}

<main>
    {{ content }}
</main>

{% include footer.html %}

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
<script src="{{ '/jquery.min.js' | relative_url }}"></script>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init();
</script>
</body>
</html>
